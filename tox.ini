[tox]
requires =
    tox>=4
env_list =
    lint
    py{39,310,311,312,313,314}
    docs
skip_missing_interpreters = true

[default]

[pkgenv]
passenv =
    CPPFLAGS
    LDFLAGS
    GSL_HOME
    FFTW3_HOME

[testenv]
description = run unit tests
package = wheel
extras = tests
passenv =
    CI_TEST_DYNAMIC_REGRESSIONS
commands =
    pytest --junitxml={env_tmp_dir}/junit-{env:JUNIT_NAME_PREFIX:}{env_name}.xml --durations=0 {posargs:test}
# Constrain packages installed inside pip's isolated build environments
# (e.g. setuptools<84 for pygsl-lite, which still uses the removed `spawn`).
# `deps` cannot do this: build isolation ignores the tox environment.
# PIP_CONSTRAINT covers pip < 26.2, PIP_BUILD_CONSTRAINT pip >= 25.3.
setenv          =
    PIP_CONSTRAINT          = {tox_root}{/}build-constraints.txt
    PIP_BUILD_CONSTRAINT    = {tox_root}{/}build-constraints.txt

[testenv:lint]
description = install black and invoke it on the current folder
skip_install = true
deps =
    black==24.4.2
commands =
    black --extend-exclude=pyseobnr/auxiliary/ --check {posargs:.}

[testenv:docs]
description = "generates the documentation using Sphinx"
package = wheel
extras = docs
package_env = .pkg-docs
# required as the name of the package "pyseobnr" is the same as the folder where the source is
# and "import pyseobnr.xxxx" in the documentation import the original source code, not the compiled
# code
changedir = {envtmpdir}
# do not inherit from the dependencies of the testenv
deps =
recreate = true
commands =
    sphinx-build --color -b html -d {envtmpdir}{/}doctrees {tox_root}/docs {envtmpdir}{/}docs_output
